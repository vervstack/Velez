syntax = "proto3";

package velez_api;

import "npm.proto";
import "google/protobuf/timestamp.proto";

option go_package = "go.vervstack.ru/velez/pkg/velez_api;velez_api";
option (npm_package) = "@vervstack/velez";

message SearchImageItem {
  string name = 1;
  optional string image_url = 2;
  string latest_tag = 3;
}

message Port {
  uint32 service_port_number = 1;
  Protocol protocol = 2;
  optional uint32 exposed_to = 3;

  enum Protocol {
    unknown = 0;
    tcp = 1;
    udp = 2;
  };
}

message Volume {
  string volume_name = 1;
  string container_path = 2;
}

message NetworkBind {
  string network_name = 1;
  repeated string aliases = 2;
  optional string ip_address = 3;
}

message Image {
  string name = 1;
  repeated string tags = 2;
  map<string, string> labels = 3;
}

message Smerd {
  string uuid = 1;
  string name = 2;
  string image_name = 3;

  repeated Port ports = 4;
  repeated Volume volumes = 5;

  Status status = 6;
  google.protobuf.Timestamp created_at = 7;

  repeated NetworkBind networks = 8;
  map<string, string> labels = 9;
  map<string, string> env = 10;

  // repo - value of the 'velez.repo' label if set, else empty.
  optional string repo = 11;

  enum Status {
    unknown = 0;
    created = 1;
    restarting = 2;
    running = 3;
    removing = 4;
    paused = 5;
    exited = 6;
    dead = 7;
  }
}

message Mount {
  string source = 1;
  string destination = 2;
  string type = 3;
  bool read_write = 4;
}

message DockerContainer {
  string id = 1;
  string name = 2;
  string image_name = 3;
  Smerd.Status status = 4;
  google.protobuf.Timestamp created_at = 5;
  map<string, string> labels = 6;
  map<string, string> env = 7;
  repeated Port ports = 8;
  repeated NetworkBind networks = 9;
  repeated Mount mounts = 10;
  bool is_registered = 11;
  optional string linked_service_name = 12;
  ServicePattern suggested_pattern = 13;
  SuggestedRunnerDefaults suggested_runner_defaults = 14;
  // Id of the root container whose network namespace this container shares (resolved through chains). Unset for a root or standalone container.
  optional string network_owner_container_id = 15;
  // Id of the container that replaced this one when it was onboarded. Set on the old container while it waits for FinishOnboarding.
  optional string replaced_by_container_id = 16;
}

// SuggestedRunnerDefaults are runner register values derived from a container's labels and env.
// provider and scope carry RunnerProvider / RunnerScope enum names: velez_common.proto cannot
// import runners_api.proto (it imports this file).
message SuggestedRunnerDefaults {
  string provider = 1;
  string scope = 2;
  string target = 3;
  string base_url = 4;
  repeated string labels = 5;
  bool is_registration_token_found = 6;
}

enum ServicePattern {
  SERVICE_PATTERN_UNSPECIFIED = 0;
  SERVICE_PATTERN_POSTGRES = 1;
  SERVICE_PATTERN_REGISTRY = 2;
  SERVICE_PATTERN_GITHUB_RUNNER = 3;
  SERVICE_PATTERN_GITLAB_RUNNER = 4;
}

// ContainerFilterField names which field of a ContainerFilter to match on.
// Adding a new field later just adds a new enum value here - an older
// server ignores a filter field it doesn't recognize instead of erroring,
// see container_manager.matchesContainerFilter's default case.
enum ContainerFilterField {
  unspecified = 0;
  // service - matches ContainerFilter.value as a case-insensitive substring
  // of the container's resolved display name.
  service = 1;
}

message ContainerFilter {
  ContainerFilterField field = 1;
  string value = 2;
}

message Container {
  message Hardware {
    // Top level cpu share amount.
    // 0.5 - give half a core
    // 1 - allocates 1 core exactly
    // 2 - allocates 2 cores
    optional float cpu = 1;
    optional uint32 ram_mb = 2;
    optional uint32 memory_swap_mb = 3;
  }

  message Settings {
    repeated Port ports = 1;
    repeated NetworkBind network = 2;
    repeated Volume volumes = 3;
  }

  message Healthcheck {
    // if command or exec is presented,
    // velez waits "retires" times for "interval_second" seconds each time,
    // until docker reports the container healthy.
    // if neither is presented, velez waits the same way
    // until container get status Running
    optional string command = 1;
    uint32 interval_second = 2;
    optional uint32 timeout_second = 3;
    uint32 retries = 4;
    // exec form: run without a shell (for images with no shell). Wins over command
    repeated string exec = 5;
  }
}


message RestartPolicy {
  RestartPolicyType type = 1;
  optional uint32 FailureCount = 2;
}

enum RestartPolicyType {
  unless_stopped = 0;
  no = 1;
  always = 2;
  on_failure = 3;
}

// Deprecated: superseded by FileConfig (repeated, one message per file)
// used by CreateSmerd_Request.plain. Left defined for historical generated
// code compatibility; no longer referenced by any RPC.
message PlainConfigSpec {
  // key: target path inside container, value: raw config bytes
  map<string, bytes> configs = 1;
}

message FileConfig {
  // target path inside container
  string path = 1;
  // raw file content
  bytes content = 2;
}

message MatreshkaConfigSpec {
  // Name of config. By default velez will try to guess config by
  // indirect signs such as (no priority)
  //  - special MATRESHKA_CONFIG tags
  //  - image (e.g. postgres, angie and etc)
  //  - smerd's name (starting with special prefix)
  optional string config_name = 1;
  // Version to load into smerd. By default - master
  optional string config_version = 2;
  // Format of config. Different default for different types
  // e.g
  //    - verv - sets config as environment variables
  //    - pg - writes to a config file
  // general rule - if target_path is not set -> it's a environment variables
  optional ConfigFormat config_format = 3;
  // target path of config.
  //    If set and has .yaml extension - writes yaml file at path
  //
  //    If not set - writes config as an environment variables
  optional string system_path = 4;
}


message Connection {
  string service_name = 1;
  string target_network = 2;
  repeated string aliases = 3;
  // environment - the isolated namespace this connection targets. Optional;
  // empty resolves to the default environment (unchanged behavior for
  // existing callers). Mirrors DropSmerd.Request.environment.
  string environment = 4;
}

enum ConfigFormat {
  yaml = 0; // Default
  env = 1;
}

message Paging {
  uint64 limit = 1;
  uint64 offset = 2;
}

message NodeBaseInfo {
  int64 id = 1;
  string name = 2;
  string addr = 3;
  NodeStatus status = 4;
  double cpu_percent = 5;
  double mem_percent = 6;
  uint64 services_count = 7;
  string region = 8;
}

enum NodeStatus {
  NodeStatus_Unknown = 0;
  NodeStatus_Online = 1;
  NodeStatus_Offline = 2;
  NodeStatus_Degraded = 3;
}

// ProvisioningTask is an in-flight or recently failed create task of an AsAService
// instance. List*Instances responses carry these so the UI can show provisioning
// progress that survives a reload. Active until its task is DONE; FAILED ones stay
// until dismissed or 5 minutes old.
message ProvisioningTask {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    PENDING = 1;
    RUNNING = 2;
    DONE = 3;
    FAILED = 4;
  }

  message Job {
    string name = 1;
    Status status = 2;
  }

  int64 task_id = 1;
  string entity_id = 2;
  string action = 3;
  Status status = 4;
  optional string error = 5;
  google.protobuf.Timestamp updated_at = 6;
  repeated Job jobs = 7;
}
