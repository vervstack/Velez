syntax = "proto3";

package velez_api;

import "google/api/annotations.proto";

import "npm.proto";
import "velez_common.proto";

option go_package = "go.vervstack.ru/velez/pkg/velez_api;velez_api";
option (npm_package) = "@vervstack/velez";

// VelezAPI direct API for work with containers.
service VelezAPI {
  rpc Version(Version.Request) returns (Version.Response) {
    option (google.api.http) = {
      get: "/api/version"
    };
  };

  rpc CreateSmerd(CreateSmerd.Request) returns (Smerd) {
    option (google.api.http) = {
      post: "/api/smerd/create"
      body: "*"
    };
  }
  rpc ListSmerds(ListSmerds.Request) returns (ListSmerds.Response) {
    option (google.api.http) = {
      post: "/api/smerd/list"
      body: "*"
    };
  }
  rpc ListContainers(ListContainers.Request) returns (ListContainers.Response) {
    option (google.api.http) = {
      post: "/api/container/list"
      body: "*"
    };
  }
  rpc RegisterContainer(RegisterContainer.Request) returns (RegisterContainer.Response) {
    option (google.api.http) = {
      post: "/api/container/register"
      body: "*"
    };
  }
  rpc GetContainer(GetContainer.Request) returns (DockerContainer) {
    option (google.api.http) = {
      get: "/api/container/{id}"
    };
  }
  rpc DropSmerd(DropSmerd.Request) returns (DropSmerd.Response) {
    option (google.api.http) = {
      post: "/api/smerd/drop"
      body: "*"
    };
  }

  rpc GetHardware(GetHardware.Request) returns (GetHardware.Response) {
    option (google.api.http) = {
      get: "/api/hardware"
    };
  }

  rpc UpgradeSmerd(UpgradeSmerd.Request) returns (UpgradeSmerd.Response) {
    option (google.api.http) = {
      post: "/api/smerd/upgrade"
      body: "*"
    };
  }

  // AssembleConfig - collects configurations
  // from container and matreshka api and fuses them to one
  // Calling this procedure will update master config in
  // matreshka instance and return body in yaml format
  rpc AssembleConfig(AssembleConfig.Request) returns (AssembleConfig.Response) {
    option (google.api.http) = {
      post: "/api/config/assemble"
      body: "*"
    };
  }

  rpc MakeConnections(MakeConnections.Request) returns (MakeConnections.Response) {
    option (google.api.http) = {
      post: "/api/smerd/connect"
      body: "*"
    };
  }

  rpc BreakConnections(BreakConnections.Request) returns (BreakConnections.Response) {
    option (google.api.http) = {
      post: "/api/smerd/disconnect"
      body: "*"
    };
  }

  rpc SearchImages(SearchImages.Request) returns (SearchImages.Response) {
    option (google.api.http) = {
      post: "/api/images",
      body: "*"
    };
  }
}

message Version {
  message Request {}

  message Response {
    string version = 1;
  }
}

message CreateSmerd {
  message Request {
    string name = 1;
    string image_name = 2;

    optional Container.Hardware hardware = 3;
    optional Container.Settings settings = 4;

    optional string command = 5;

    map<string, string> env = 6;

    optional Container.Healthcheck healthcheck = 7;

    map<string, string> labels = 8;

    bool ignore_config = 9;
    bool use_image_ports = 10;

    bool auto_upgrade = 11;

    RestartPolicy restart = 12;

    // verv and plain are independent and may both be set at once: verv is
    // fetched/applied first, then plain's files are mounted on top - they no
    // longer form a mutually-exclusive oneof.
    optional MatreshkaConfigSpec verv = 13;

    reserved 14; // was PlainConfigSpec plain - do not reuse, see FileConfig plain below.

    // is_declarative_deploy - flag allows caller to manage idempotency of calls
    //
    // False (default):
    //      if defined smerd already exist - api call fails
    // True:
    //      if smerd already exist and healthy
    //      this api call won't fail.
    // TODO maybe even support to upgrade to presented state will be implemented some day
    bool is_declarative_deploy = 15;

    repeated FileConfig plain = 16;

    // environment - the isolated namespace this operation targets (not to be
    // confused with the env map above, which is container env vars).
    // Required; validated in the service layer, not here (proto3 has no
    // `required` keyword).
    string environment = 17;

    // repo - git repository URL this app's source lives in. Optional;
    // purely reference metadata today, stamped onto the container as
    // labels.RepoLabel - no build-from-git behavior yet.
    optional string repo = 18;

    // TODO add sidecar definition
    // TODO add resources definition
  }
}

message ListSmerds {
  message Request {
    optional uint32 limit = 1;
    optional string name = 2;
    optional string id = 3;
    map<string, string> label = 4;

    // environment - the isolated namespace to scope this list to. Required;
    // validated in the service layer, not here (proto3 has no `required`
    // keyword).
    string environment = 5;
  }

  message Response {
    repeated Smerd smerds = 1;
  }
}

message ListContainers {
  message Request {
    // environment - the isolated namespace whose daemon to list. Required;
    // validated in the service layer, not here (proto3 has no `required`
    // keyword).
    string environment = 1;
    optional uint32 limit = 2;
    repeated ContainerFilter filters = 3;
  }

  message Response {
    repeated DockerContainer containers = 1;
  }
}

message RegisterContainer {
  message Request {
    string container_id = 1;
    string environment = 2;
    string service_name = 3;
    oneof pattern {
      GenericPattern generic = 4;
      PgPattern pg = 5;
      RegistryPattern registry = 6;
      RunnerPattern runner = 7;
    }

    // bind_mount_links lists every bind mount of the container to keep. Each is linked, not copied:
    // a Docker named volume backed by the same host directory replaces the bind mount. A container
    // with a bind mount that is not listed here is refused.
    repeated BindMountLink bind_mount_links = 8;
    // keep_port_mapping reuses the container's existing host ports. Requires stopping the old container
    // before creating the new one (downtime). Default false. Single mode only.
    bool keep_port_mapping = 9;
    // ports are the port mappings the recreated container publishes when keep_port_mapping is false.
    // Empty = the container is recreated with no published ports. Single mode only.
    repeated Port ports = 10;

    message BindMountLink {
      string source = 1; // host path of the bind mount being linked
      optional string volume_name = 2; // default: derived from service name + container target path
    }

    message GenericPattern {}
    message PgPattern {
      // superuser/password are required when the container env carries no admin login.
      optional string superuser = 1;
      optional string password = 2;
    }
    message RegistryPattern {}
    message RunnerPattern {}
  }
  message Response {
    // entity_id/action identify the register_container task; callers watch it via TasksApi.WatchTask.
    string entity_id = 1;
    string action = 2;
  }
}

message GetContainer {
  message Request {
    string id = 1;
    string environment = 2;
  }
}

message DropSmerd {
  message Request {
    repeated string uuids = 1;
    repeated string name = 2;

    // environment - the isolated namespace this operation targets. Required;
    // validated in the service layer, not here (proto3 has no `required`
    // keyword).
    string environment = 3;
  }

  message Response {
    message Error {
      string uuid = 1;
      string cause = 2;
    }

    repeated Error failed = 1;
    repeated string successful = 2;
  }
}

message GetHardware {
  message Request {

  }

  message Response {
    message Value {
      string value = 1;
      string err = 2;
    }
    Value cpu = 1;
    Value disk_mem = 2;
    Value ram = 3;

    repeated uint32 ports_available = 4;
    repeated uint32 ports_occupied = 5;

    // is_running_in_container reports whether this node's velez instance is
    // itself running inside a container, as opposed to a bare binary on the
    // host. Binary-mode nodes must publish container ports to the host to
    // reach them (see EnableStatefullCluster).
    bool is_running_in_container = 6;

    // node_region is this node's configured region (config.Environment.NodeRegion).
    string node_region = 7;
  }
}

message AssembleConfig {
  message Request {
    string image_name = 1;
    string service_name = 2;
  }
  message Response {
    bytes config = 1;
  }
}

message UpgradeSmerd {
  message Request {
    string name = 1;
    string image = 2;

    // environment - the isolated namespace this operation targets. Required;
    // validated in the service layer, not here (proto3 has no `required`
    // keyword).
    string environment = 3;
  }
  message Response {}
}

message MakeConnections {
  message Request {
    repeated Connection connections = 1;
  }

  message Response {}
}

message BreakConnections {
  message Request {
    repeated Connection connections = 1;
  }

  message Response {}
}

message SearchImages {
  message Request {
    string name = 1;
    optional bool use_registry = 2;
    optional bool use_only_official = 3;
    optional int64 registry_id = 4;
  };
  message Response{
    repeated SearchImageItem images = 1;
  };
}