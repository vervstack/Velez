syntax = "proto3";

package velez_api;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

import "npm.proto";
import "container_registry_api.proto";
import "control_plane_api.proto";
import "service_api.proto";
import "velez_api.proto";
import "velez_common.proto";

option go_package = "go.vervstack.ru/velez/pkg/velez_api;velez_api";
option (npm_package) = "@vervstack/velez";

// TasksApi exposes progress/status for durable, resumable tasks
// executed by the internal task/job engine.
service TasksApi {
  rpc WatchTask(WatchTask.Request) returns (stream TaskStatus) {
    option (google.api.http) = {
      get: "/api/tasks/watch"
    };
  }

  // CreateSmerdStream is an additive streaming pilot alongside VelezAPI's
  // existing unary CreateSmerd: it enqueues the same create_smerd task and
  // forwards TaskStatus updates as the task progresses, reusing WatchTask's
  // TaskStatus shape rather than inventing a new message. Lives here (not on
  // VelezAPI) because tasks.proto imports velez_api.proto - the reverse
  // import would be circular. The unary CreateSmerd is untouched.
  rpc CreateSmerdStream(CreateSmerd.Request) returns (stream TaskStatus) {
    option (google.api.http) = {
      post: "/api/smerd/create/stream"
      body: "*"
    };
  }
}

message WatchTask {
  message Request {
    string entity_id = 1;
    string action = 2;
  }
}

message TaskStatus {
  enum Status {
    UNKNOWN = 0;
    PENDING = 1;
    RUNNING = 2;
    DONE = 3;
    FAILED = 4;
  }

  Status status = 1;
  optional string error = 2;
  google.protobuf.Timestamp updated_at = 3;
  int64 task_id = 4;
  repeated JobStatus jobs = 5;

  message JobStatus {
    string name = 1;
    TaskStatus.Status status = 2;
  }
}

// CreateSmerdTaskPayload is the task context for the "create_smerd" action.
// It carries only the business data jobs need to hand off to one another;
// per-job execution status lives separately in the task engine's own tables.
message CreateSmerdTaskPayload {
  CreateSmerd.Request request = 1;

  // Set once the image has been prepared/inspected.
  optional string image_id = 2;
  // Set once the container has been created.
  optional string container_id = 3;

  // Set once the image has been pulled/inspected.
  map<string, string> image_labels = 4;
  repeated string image_tags = 5;
  // Raw nat.Port keys (e.g. "5432/tcp") from the image's exposed ports,
  // used by prepare_verv_config when the request has use_image_ports set.
  repeated string image_exposed_ports = 6;

  // Config file content to copy into the container before it starts,
  // resolved by fetch_config. Same shape/purpose as
  // CopyToVolumeTaskPayload.path_to_files.
  map<string, bytes> path_to_files = 7;

  // Velez-internal only: gates the host Docker socket bind-mount in
  // create_smerd's create_container job. Never settable by the public
  // CreateSmerd/CreateDeploy API surface - only internal/workers/deploy_watcher.go
  // may set this, after checking internal/service/secrets for a
  // server-written marker. A client-supplied CreateSmerdTaskPayload can never
  // reach this field.
  bool allow_docker_socket = 8;
}

// CreateServiceTaskPayload is the task context for the "create_service" action.
message CreateServiceTaskPayload {
  string name = 1;
}

// AssembleConfigTaskPayload is the task context for the "assemble_config" action.
message AssembleConfigTaskPayload {
  string service_name = 1;
  string image_name = 2;

  // Set once the scratch image has been pulled/inspected.
  map<string, string> image_labels = 3;
  repeated string image_tags = 4;

  // Set once the scratch container has been created.
  optional string container_id = 5;

  // Set once config metadata has been resolved and its raw content fetched
  // from the container.
  optional string config_name = 6;
  optional string config_version = 7;
  // matreshka_api.ConfigType's enum name, e.g. "plain"/"verv"/"pg".
  // Kept as a string rather than the typed enum to avoid a proto dependency
  // on the matreshka_api package (see moti.yaml deps for its pinned version).
  optional string conf_type = 8;
  optional ConfigFormat config_format = 9;
  optional bytes content_raw = 10;

  // Set once content_raw has been parsed into evon (env) format.
  optional bytes content = 11;
}

// CopyToVolumeTaskPayload is the task context for the "copy_to_volume" action.
message CopyToVolumeTaskPayload {
  string volume_name = 1;
  // Path inside the loader container -> file content. A dynamic number of
  // copy_file_<n> jobs are built from this map, one per entry, sorted by
  // path so job naming stays stable across BuildJobs re-runs.
  map<string, bytes> path_to_files = 2;

  // Set once the loader container has been created.
  optional string container_id = 3;
}

// ConnectServiceToVpnTaskPayload is the task context for the
// "connect_service_to_vpn" action.
message ConnectServiceToVpnTaskPayload {
  string service_name = 1;

  // Set once the Headscale namespace has been found/created.
  optional string namespace_id = 2;
  // Headscale auth key - sensitive, persisted verbatim into the task's
  // JSON context (see docs/jobs_migrations/questions.md).
  optional string client_key = 3;
  // Set once the login server url has been resolved (currently a constant).
  optional string login_server_url = 4;
  // Set once the tailscale sidecar container has been created.
  optional string container_id = 5;
}

// EnableStatefullTaskPayload is the task context for the
// "enable_statefull_mode" action.
message EnableStatefullTaskPayload {
  EnableStatefullCluster request = 1;

  // Generated once by generate_credentials (or derived from any
  // pre-existing root dsn) and persisted so resuming a partially-completed
  // task reuses the same passwords instead of regenerating ones that would
  // mismatch an already-created container/user - same secret-persistence
  // precedent as ConnectServiceToVpnTaskPayload.client_key.
  optional string root_pwd = 2;
  optional string user_pwd = 3;

  // Set once the postgres container has been created.
  optional string container_id = 4;
  // Set once the root connection dsn has been resolved from the running
  // container.
  optional string root_dsn = 5;
}

// DropSmerdTaskPayload is the task context for the "drop_smerd" action. One
// drop_container_<n> job is built per identifier in request.uuids ++
// request.name; each job appends its own result into failed/successful
// rather than failing the task, mirroring the old DropSmerds' contract that
// the RPC's top-level error is always nil and per-item failures are only
// visible in the response body.
message DropSmerdTaskPayload {
  DropSmerd.Request request = 1;

  repeated DropSmerd.Response.Error failed = 2;
  repeated string successful = 3;
}

// UpgradeSmerdTaskPayload is the task context for the "upgrade_smerd" action.
message UpgradeSmerdTaskPayload {
  UpgradeSmerd.Request upgrade_request = 1;

  // Built from inspecting the currently-running container and mutated in
  // place across stages (name changes for the scratch config-fetcher
  // container, then the "_new" container) - mirrors do_smerd_upgrade.go's
  // single mutable newLaunch variable. See docs/jobs_migrations/questions.md.
  CreateSmerd.Request request = 2;

  // Set once the old (currently running) container has been inspected.
  optional string old_container_id = 3;

  // Set once the new image has been pulled/inspected.
  map<string, string> image_labels = 4;
  repeated string image_tags = 5;

  // Reused across both container-create stages (scratch config-fetcher
  // container, then the final "_new" container) - mirrors the original
  // pipeline's single newContId variable reuse; see questions.md.
  optional string container_id = 6;

  // allow_docker_socket mirrors CreateSmerdTaskPayload.allow_docker_socket -
  // set by internal/workers/deploy_watcher.go's upgrade() from the same
  // docker-socket grant secret deploy() checks, so a github_runner (or any
  // future grantee) upgrade keeps its host Docker-socket bind-mount instead
  // of silently losing it on the next blue-green swap.
  bool allow_docker_socket = 7;
}

// CreateRegistryInstanceTaskPayload is the task context for the
// "create_registry_instance" action - see
// docs/features/pgaas_and_registry_plugin.md section 4. Supersedes the
// retired EnableRegistryTaskPayload/EnableRegistry plugin path.
message CreateRegistryInstanceTaskPayload {
  CreateRegistryInstance.Request request = 1;

  // Generated once by generate_credentials and persisted so resuming a
  // partially-completed task reuses the same username/password instead of
  // regenerating ones that would mismatch the htpasswd entry already written
  // into the registry-auth volume - same secret-persistence precedent as
  // EnableStatefullTaskPayload.root_pwd/user_pwd.
  optional string username = 2;
  optional string password = 3;

  // Set once the htpasswd loader container has been created.
  optional string container_id = 4;

  // Set once both the registry's and the UI sidecar's host ports have been
  // resolved by resolve_ports (either the caller's requested
  // expose_to_port for the registry, or auto-assigned from the node's port
  // pool for both) - persisted so later jobs build urls/labels without
  // re-deriving them, and so a crash-resumed task reuses the same ports
  // instead of picking new ones. The registry's own container labels must
  // carry ui_exposed_port at create time (Docker labels are immutable after
  // creation), so both ports are resolved before either container deploys.
  optional uint32 exposed_port = 5;
  optional uint32 ui_exposed_port = 6;
}

