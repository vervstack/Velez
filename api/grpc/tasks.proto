syntax = "proto3";

package velez_api;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

import "npm.proto";
import "pgaas_api.proto";
import "container_registry_api.proto";
import "control_plane_api.proto";
import "dind_api.proto";
import "runners_api.proto";
import "s3_api.proto";
import "service_api.proto";
import "velez_api.proto";
import "velez_common.proto";

option go_package = "go.vervstack.ru/velez/pkg/velez_api;velez_api";
option (npm_package) = "@vervstack/velez";

// TasksApi exposes progress/status for durable, resumable tasks
// executed by the internal task/job engine.
service TasksApi {
  rpc WatchTask(WatchTask.Request) returns (stream TaskStatus) {
    option (google.api.http) = {
      get: "/api/tasks/watch"
    };
  }

  // CreateSmerdStream is an additive streaming pilot alongside VelezAPI's
  // existing unary CreateSmerd: it enqueues the same create_smerd task and
  // forwards TaskStatus updates as the task progresses, reusing WatchTask's
  // TaskStatus shape rather than inventing a new message. Lives here (not on
  // VelezAPI) because tasks.proto imports velez_api.proto - the reverse
  // import would be circular. The unary CreateSmerd is untouched.
  rpc CreateSmerdStream(CreateSmerd.Request) returns (stream TaskStatus) {
    option (google.api.http) = {
      post: "/api/smerd/create/stream"
      body: "*"
    };
  }

  // WatchServiceUpgrade follows a service's in-flight upgrade: PENDING with no
  // jobs while the upgrade is scheduled but not picked up yet, then the live
  // upgrade_smerd task with its per-job statuses, then its terminal status,
  // after which the stream closes. Closes without sending when nothing is in flight.
  rpc WatchServiceUpgrade(WatchServiceUpgrade.Request) returns (stream TaskStatus) {
    option (google.api.http) = {
      get: "/api/tasks/service_upgrade/{service_name}"
    };
  }

  rpc DismissTask(DismissTask.Request) returns (DismissTask.Response) {
    option (google.api.http) = {
      post: "/api/tasks/dismiss"
      body: "*"
    };
  }
}

message DismissTask {
  message Request {
    string entity_id = 1;
    string action = 2;
  }
  message Response {}
}

message WatchTask {
  message Request {
    string entity_id = 1;
    string action = 2;
  }
}

message WatchServiceUpgrade {
  message Request {
    string service_name = 1;
  }
}

message TaskStatus {
  enum Status {
    UNKNOWN = 0;
    PENDING = 1;
    RUNNING = 2;
    DONE = 3;
    FAILED = 4;
  }

  Status status = 1;
  optional string error = 2;
  google.protobuf.Timestamp updated_at = 3;
  int64 task_id = 4;
  repeated JobStatus jobs = 5;

  message JobStatus {
    string name = 1;
    TaskStatus.Status status = 2;
  }
}

// CreateSmerdTaskPayload is the task context for the "create_smerd" action.
// It carries only the business data jobs need to hand off to one another;
// per-job execution status lives separately in the task engine's own tables.
message CreateSmerdTaskPayload {
  CreateSmerd.Request request = 1;

  // Set once the image has been prepared/inspected.
  optional string image_id = 2;
  // Set once the container has been created.
  optional string container_id = 3;

  // Set once the image has been pulled/inspected.
  map<string, string> image_labels = 4;
  repeated string image_tags = 5;
  // Raw nat.Port keys (e.g. "5432/tcp") from the image's exposed ports,
  // used by prepare_verv_config when the request has use_image_ports set.
  repeated string image_exposed_ports = 6;

  // Config file content to copy into the container before it starts,
  // resolved by fetch_config. Same shape/purpose as
  // CopyToVolumeTaskPayload.path_to_files.
  map<string, bytes> path_to_files = 7;

  // Velez-internal only: gates the host Docker socket bind-mount in
  // create_smerd's create_container job. Never settable by the public
  // CreateSmerd/CreateDeploy API surface - only internal/workers/deploy_watcher.go
  // may set this, after checking internal/service/secrets for a
  // server-written marker. A client-supplied CreateSmerdTaskPayload can never
  // reach this field.
  bool allow_docker_socket = 8;

  // Velez-internal only, same trust model as allow_docker_socket: set from a
  // Velez-internal secret grant, never from a client request.
  ContainerIsolation isolation = 9;
}

// CreateServiceTaskPayload is the task context for the "create_service" action.
message CreateServiceTaskPayload {
  string name = 1;
}

// AssembleConfigTaskPayload is the task context for the "assemble_config" action.
message AssembleConfigTaskPayload {
  string service_name = 1;
  string image_name = 2;

  // Set once the scratch image has been pulled/inspected.
  map<string, string> image_labels = 3;
  repeated string image_tags = 4;

  // Set once the scratch container has been created.
  optional string container_id = 5;

  // Set once config metadata has been resolved and its raw content fetched
  // from the container.
  optional string config_name = 6;
  optional string config_version = 7;
  // matreshka_api.ConfigType's enum name, e.g. "plain"/"verv"/"pg".
  // Kept as a string rather than the typed enum to avoid a proto dependency
  // on the matreshka_api package (see moti.yaml deps for its pinned version).
  optional string conf_type = 8;
  optional ConfigFormat config_format = 9;
  optional bytes content_raw = 10;

  // Set once content_raw has been parsed into evon (env) format.
  optional bytes content = 11;
}

// CopyToVolumeTaskPayload is the task context for the "copy_to_volume" action.
message CopyToVolumeTaskPayload {
  string volume_name = 1;
  // Path inside the loader container -> file content. A dynamic number of
  // copy_file_<n> jobs are built from this map, one per entry, sorted by
  // path so job naming stays stable across BuildJobs re-runs.
  map<string, bytes> path_to_files = 2;

  // Set once the loader container has been created.
  optional string container_id = 3;
}

// ConnectServiceToVpnTaskPayload is the task context for the
// "connect_service_to_vpn" action.
message ConnectServiceToVpnTaskPayload {
  string service_name = 1;

  // Set once the Headscale namespace has been found/created.
  optional string namespace_id = 2;
  // Headscale auth key - sensitive, persisted verbatim into the task's
  // JSON context (see docs/jobs_migrations/questions.md).
  optional string client_key = 3;
  // Set once the login server url has been resolved (currently a constant).
  optional string login_server_url = 4;
  // Set once the tailscale sidecar container has been created.
  optional string container_id = 5;
}

// EnableStatefullTaskPayload is the task context for the
// "enable_statefull_mode" action.
message EnableStatefullTaskPayload {
  EnableStatefullCluster request = 1;

  // Generated once by generate_credentials (or derived from any
  // pre-existing root dsn) and persisted so resuming a partially-completed
  // task reuses the same passwords instead of regenerating ones that would
  // mismatch an already-created container/user - same secret-persistence
  // precedent as ConnectServiceToVpnTaskPayload.client_key.
  optional string root_pwd = 2;
  optional string user_pwd = 3;

  // Set once the postgres container has been created.
  optional string container_id = 4;
  // Set once the root connection dsn has been resolved from the running
  // container.
  optional string root_dsn = 5;
}

// DropSmerdTaskPayload is the task context for the "drop_smerd" action. One
// drop_container_<n> job is built per identifier in request.uuids ++
// request.name; each job appends its own result into failed/successful
// rather than failing the task, mirroring the old DropSmerds' contract that
// the RPC's top-level error is always nil and per-item failures are only
// visible in the response body.
message DropSmerdTaskPayload {
  DropSmerd.Request request = 1;

  repeated DropSmerd.Response.Error failed = 2;
  repeated string successful = 3;
}

// UpgradeSmerdTaskPayload is the task context for the "upgrade_smerd" action.
message UpgradeSmerdTaskPayload {
  UpgradeSmerd.Request upgrade_request = 1;

  // Built from inspecting the currently-running container and mutated in
  // place across stages (name changes for the scratch config-fetcher
  // container, then the "_new" container) - mirrors do_smerd_upgrade.go's
  // single mutable newLaunch variable. See docs/jobs_migrations/questions.md.
  CreateSmerd.Request request = 2;

  // Set once the old (currently running) container has been inspected.
  optional string old_container_id = 3;

  // Set once the new image has been pulled/inspected.
  map<string, string> image_labels = 4;
  repeated string image_tags = 5;

  // Reused across both container-create stages (scratch config-fetcher
  // container, then the final "_new" container) - mirrors the original
  // pipeline's single newContId variable reuse; see questions.md.
  optional string container_id = 6;

  // allow_docker_socket mirrors CreateSmerdTaskPayload.allow_docker_socket -
  // set by internal/workers/deploy_watcher.go's upgrade() from the same
  // docker-socket grant secret deploy() checks, so a github_runner (or any
  // future grantee) upgrade keeps its host Docker-socket bind-mount instead
  // of silently losing it on the next blue-green swap.
  bool allow_docker_socket = 7;

  // extra_labels are merged over the labels captured from the old container
  // when the new container's request is built, so they always win. Used by
  // register_container to stamp service labels through a blue-green recreate.
  map<string, string> extra_labels = 8;

  // stop_old_first stops the old container instead of pausing it, freeing
  // its host ports for the new one. Unset keeps the pause-based swap.
  bool stop_old_first = 9;

  // ports_override / volumes_override replace the ports / volumes captured
  // from the old container when the new container's request is built. A
  // present-but-empty override means "none".
  optional PortsOverride ports_override = 10;
  optional VolumesOverride volumes_override = 11;

  // extra_env is merged over the env captured from the old container when the
  // new container's request is built, so it always wins. Used by
  // register_container to stamp the Postgres admin login into a container
  // whose env lacked it.
  map<string, string> extra_env = 12;

  // sidecar_container_names are the containers sharing the old container's
  // network namespace, set by discover_sidecars and recreated by
  // recreate_sidecars once the new container has replaced the old one.
  repeated string sidecar_container_names = 13;

  // is_sidecars_skipped leaves sidecars to the caller. Set by
  // register_container, which recreates its own sidecar group.
  bool is_sidecars_skipped = 14;

  // is_old_container_kept keeps the old container (renamed "<name>_old", paused or stopped) instead of dropping it after the swap; set by register_container.
  bool is_old_container_kept = 15;

  // Same trust model as CreateSmerdTaskPayload.isolation.
  ContainerIsolation isolation = 16;

  // extra_networks are attached to the new container in addition to the
  // networks captured from the old one; a network already captured (by name)
  // is left untouched. Used by upgrade_deploy to carry spec-declared networks
  // that carry no aliases and so are invisible to the capture.
  repeated NetworkBind extra_networks = 17;

  // removed_env lists keys deleted from the env captured from the old
  // container, after extra_env is merged. Set by the deploy watcher with the
  // keys a scheduled upgrade's spec dropped relative to the applied spec.
  repeated string removed_env = 18;

  message PortsOverride {
    repeated Port ports = 1;
  }
  message VolumesOverride {
    repeated Volume volumes = 1;
  }
}

// RegisterContainerTaskPayload is the task context for the
// "register_container" action. Flat fields only - the RegisterContainer
// request carries a oneof, which encoding/json can't round-trip.
message RegisterContainerTaskPayload {
  string container_id = 1;
  string environment = 2;
  string service_name = 3;

  // Set by inspect_container.
  string container_name = 4;
  string image_name = 5;

  // Set by upsert_service.
  int64 service_id = 6;

  repeated RegisterContainer.Request.BindMountLink bind_mount_links = 7;
  bool keep_port_mapping = 8;
  repeated Port ports = 9;

  // pattern is the registration pattern; UNSPECIFIED is the generic one.
  ServicePattern pattern = 10;

  // pg_superuser is the Postgres admin user: the RPC sets what the request
  // carried; verify_pg_login overwrites it with the effective one (container
  // env first). Not secret.
  string pg_superuser = 11;

  reserved 12;
  reserved "pg_password";

  // pg_pending_secret_owner is the owner of the pending secret ("pgaas-pending"
  // scope) holding the request-supplied Postgres password - never the value.
  // Empty when the request carried no password.
  string pg_pending_secret_owner = 13;

  RunnerProvider runner_provider = 14;
  RunnerScope runner_scope = 15;
  string runner_target = 16;
  string runner_base_url = 17;
  repeated string runner_labels = 18;
  string runner_docker_image = 19;
  int32 runner_concurrent = 20;

  // runner_pending_secret_owner is the owner of the pending secrets ("runneraas-pending" scope)
  // holding the request-supplied runner access and registration tokens - never the values.
  string runner_pending_secret_owner = 21;

  // registry_username is the registry's htpasswd user: the RPC sets what the request carried;
  // verify_registry_login overwrites it with the effective one (empty when the container has no auth).
  // Not secret.
  string registry_username = 22;

  // registry_pending_secret_owner is the owner of the pending secret ("registryaas-pending" scope)
  // holding the request-supplied registry password - never the value.
  string registry_pending_secret_owner = 23;

  // Filled by inspect_container: names of containers sharing the root's network namespace, adopted together with the root.
  repeated string sidecar_container_names = 24;

  // Filled by inspect_container: the root is already registered (service label or binding), only its unregistered sidecars are adopted.
  bool is_root_registered = 25;

  // image_tag is the tag the registered container is pinned to; unset keeps its current image reference.
  optional string image_tag = 26;
}

// CreateRegistryInstanceTaskPayload is the task context for the
// "create_registry_instance" action - see
// docs/features/pgaas_and_registry_plugin.md section 4. Supersedes the
// retired EnableRegistryTaskPayload/EnableRegistry plugin path.
message CreateRegistryInstanceTaskPayload {
  CreateRegistryInstance.Request request = 1;

  // Generated once by generate_credentials and persisted so resuming a
  // partially-completed task reuses the same username/password instead of
  // regenerating ones that would mismatch the htpasswd entry already written
  // into the registry-auth volume - same secret-persistence precedent as
  // EnableStatefullTaskPayload.root_pwd/user_pwd.
  optional string username = 2;
  optional string password = 3;

  // Set once the htpasswd loader container has been created.
  optional string container_id = 4;

  // Set once both the registry's and the UI sidecar's host ports have been
  // resolved by resolve_ports (either the caller's requested
  // expose_to_port for the registry, or auto-assigned from the node's port
  // pool for both) - persisted so later jobs build urls/labels without
  // re-deriving them, and so a crash-resumed task reuses the same ports
  // instead of picking new ones. The registry's own container labels must
  // carry ui_exposed_port at create time (Docker labels are immutable after
  // creation), so both ports are resolved before either container deploys.
  optional uint32 exposed_port = 5;
  optional uint32 ui_exposed_port = 6;

  // Set once ensure_s3_storage has created the bucket and the registry's
  // key on the S3 instance named in request.s3_storage, so a resumed task
  // reuses them instead of issuing a second key.
  optional string s3_bucket_id = 7;
  optional string s3_access_key_id = 8;

  // Latest create_smerd task id for the entity before the deploy was
  // scheduled; wait_for_registry_deploy ignores tasks with id <= this.
  optional int64 deploy_baseline_task_id = 9;
}

enum ContainerIsolation {
  CONTAINER_ISOLATION_UNSPECIFIED = 0;
  CONTAINER_ISOLATION_SYSBOX = 1;
  CONTAINER_ISOLATION_PRIVILEGED = 2;
}

// CreateDindTaskPayload is the task context for the "create_dind" action.
message CreateDindTaskPayload {
  CreateDind.Request request = 1;
  string network_name = 2;
  string address = 3;
}

// CreatePgInstanceTaskPayload is the task context for the "create_pg_instance" action.
message CreatePgInstanceTaskPayload {
  CreatePgInstance.Request request = 1;
}

// CreateS3InstanceTaskPayload is the task context for the
// "create_s3_instance" action. Generated secrets live in secrets.Store, never
// here. Ports are persisted once resolved so a resumed task reuses them.
message CreateS3InstanceTaskPayload {
  CreateS3Instance.Request request = 1;
  optional uint32 exposed_port = 2;
  // Admin API host port. Set only when Velez runs outside a container and
  // needs a host port to reach the admin API.
  optional uint32 admin_exposed_port = 3;
  optional uint32 web_ui_exposed_port = 4;
  // Garage node id, read from GetClusterStatus before the layout is applied.
  optional string node_id = 5;
}

// CreateRunnerTaskPayload is the task context for the "create_runner"
// action. Mirrors CreateRegistryInstanceTaskPayload's shape: the minted
// registration_token is persisted once so a crash-resumed task reuses it
// instead of re-minting a token that would mismatch the one already written
// into the runner container's env/secret store.
message CreateRunnerTaskPayload {
  CreateRunner.Request request = 1;
  // For GitLab it carries the minted `glrt-` runner authentication token
  // (cleared after seed_runner_config).
  optional string registration_token = 2;

  // Latest create_smerd task id for the entity before the deploy was
  // scheduled; wait_for_runner_deploy ignores tasks with id <= this.
  optional int64 deploy_baseline_task_id = 3;

  // GitLab runner id minted by mint_runner_token; 0/unset for GitHub.
  optional int64 gitlab_runner_id = 4;
}

// ReregisterRunnerTaskPayload is the task context for the
// "reregister_runner" action. No registration_token field - unlike
// create_runner, reregister always reuses the token already in the secret
// store, never mints/passes one through the task context.
message ReregisterRunnerTaskPayload {
  ReregisterRunner.Request request = 1;
}


// DropPgInstanceTaskPayload is the task context for the "drop_pg_instance" action; name is the instance's list name, i.e. the service name.
message DropPgInstanceTaskPayload {
  string name = 1;
}

// DropS3InstanceTaskPayload is the task context for the "drop_s3_instance" action; name is the instance's list name, i.e. the service name.
message DropS3InstanceTaskPayload {
  string name = 1;
}

// DropRegistryInstanceTaskPayload is the task context for the "drop_registry_instance" action; name is the instance's list name, i.e. the service name.
message DropRegistryInstanceTaskPayload {
  string name = 1;
}

// DropRunnerTaskPayload is the task context for the "drop_runner" action; name is the instance's list name, i.e. the service name.
message DropRunnerTaskPayload {
  string name = 1;
}

// DropDindTaskPayload is the task context for the "drop_dind" action; name is the instance's list name, i.e. the service name.
message DropDindTaskPayload {
  string name = 1;
}

// SetRunnerBuildkitTaskPayload is the task context for the
// "set_runner_buildkit" action.
message SetRunnerBuildkitTaskPayload {
  SetRunnerBuildkit.Request request = 1;
}
