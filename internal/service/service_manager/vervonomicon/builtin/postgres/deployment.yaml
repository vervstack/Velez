app:
  # image is set explicitly, unlike a normal service descriptor - this
  # descriptor is embedded into the Velez binary itself
  # (SourceKindBuiltin), not baked into an image, so there is nothing for
  # Velez to inspect .verv/ out of.
  image: postgres:18

  ports:
    - port: 5432
      protocol: tcp

  # postgres:18 stores data under a major-version subdirectory and refuses to
  # start if the volume is mounted at the legacy .../data path (it reports it
  # as an "unused mount/volume" and exits 1). Mount the parent, matching the
  # working cluster pattern in internal/patterns/db_patterns/pg_pattern.
  volumes:
    - name: postgres-data
      path: /var/lib/postgresql

  # No env here - POSTGRES_DB/POSTGRES_USER/POSTGRES_PASSWORD are overlaid by
  # the service layer at deploy time. No descriptor file ever contains a
  # credential.
  healthcheck:
    command: pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB" -h 127.0.0.1 -p 5432
    interval_second: 5
    timeout_second: 3
    retries: 12

  restart: unless_stopped

  box: small
