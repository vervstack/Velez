syntax = "proto3";

package velez_api;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "npm.proto";

import "velez_common.proto";

option go_package = "go.vervstack.ru/velez/pkg/velez_api;velez_api";
option (npm_package) = "@vervstack/velez";

// HaproxyAPI manages PostgreSQL balancers backed by HAProxy containers.
service HaproxyAPI {
  rpc CreateHaproxyInstance(CreateHaproxyInstance.Request) returns (CreateHaproxyInstance.Response) {
    option (google.api.http) = {
      post: "/api/haproxy/create"
      body: "*"
    };
  }

  rpc BootstrapVcnSidecar(BootstrapVcnSidecar.Request) returns (BootstrapVcnSidecar.Response) {
    option (google.api.http) = {
      post: "/api/haproxy/vcn-bootstrap"
      body: "*"
    };
  }

  rpc ValidatePgBackend(ValidatePgBackend.Request) returns (ValidatePgBackend.Response) {
    option (google.api.http) = {
      post: "/api/haproxy/validate-backend"
      body: "*"
    };
  }

  rpc ValidateHaproxyTarget(ValidateHaproxyTarget.Request) returns (ValidateHaproxyTarget.Response) {
    option (google.api.http) = {
      post: "/api/haproxy/validate-target"
      body: "*"
    };
  }

  rpc ListHaproxyInstances(ListHaproxyInstances.Request) returns (ListHaproxyInstances.Response) {
    option (google.api.http) = {
      post: "/api/haproxy/list"
      body: "*"
    };
  }

  rpc DropHaproxyInstance(DropHaproxyInstance.Request) returns (DropHaproxyInstance.Response) {
    option (google.api.http) = {
      post: "/api/haproxy/drop"
      body: "*"
    };
  }

  rpc SelectHaproxyMaster(SelectHaproxyMaster.Request) returns (SelectHaproxyMaster.Response) {
    option (google.api.http) = {
      post: "/api/haproxy/select-master"
      body: "*"
    };
  }
}

message HaproxyInstance {
  string name = 1;
  string master_pg_instance = 2;
  uint32 port = 3;
  string status = 4;
  google.protobuf.Timestamp created_at = 5;
  string environment = 6;
}

message CreateHaproxyInstance {
  message Request {
    string name = 1;
    string master_pg_instance = 2;
    // The listener and published port. Defaults to 5432 when absent.
    optional uint32 port = 3;
    optional string environment = 4;
    optional string box = 5;
    HaproxyConnectionTarget connection_target = 6;
    // Defaults to true for older callers.
    optional bool publish_port = 7;
    repeated PgBackend backends = 8;
    optional string sidecar_container_id = 9;
  }
  message Response {
    string entity_id = 1;
    string action = 2;
  }
}

message HaproxyConnectionTarget {
  message Endpoint {
    string host = 1;
    uint32 port = 2;
  }

  // Supply at most one target. An empty target uses the default Docker network.
  optional string docker_network = 1;
  Endpoint public_endpoint = 2;
  // A Tailscale IP address. The sidecar is connected after provisioning.
  Endpoint tailscale_endpoint = 3;
}

message PgBackend {
  string name = 1;
  oneof source {
    string velez_service = 2;
    HaproxyConnectionTarget.Endpoint endpoint = 3;
  }
  string user = 4;
  string password = 5;
  enum Role {
    PRIMARY = 0;
    BACKUP = 1;
    BALANCED = 2;
  }
  Role role = 6;
  HaproxyConnectionTarget connection_target = 7;
  optional string environment = 8;
}

message BootstrapVcnSidecar {
  message Request {
    string name = 1;
    string auth_key = 2;
    string login_server_url = 3;
    string hostname = 4;
    repeated Port ports = 5;
    // Return the task handle immediately for clients that watch live progress.
    bool is_async = 6;
  }
  message Response {
    string container_id = 1;
    string entity_id = 2;
    string action = 3;
  }
}

message ValidatePgBackend {
  message Request {
    PgBackend backend = 1;
    optional string sidecar_container_id = 2;
  }
  message Response {
    bool ok = 1;
    string error_message = 2;
  }
}

message ValidateHaproxyTarget {
  message Request {
    string master_pg_instance = 1;
    // An explicitly empty docker_network detects a joinable network.
    HaproxyConnectionTarget connection_target = 2;
    optional string environment = 3;
  }
  message Response {
    bool ok = 1;
    string error_message = 2;
    string docker_network = 3;
  }
}

message ListHaproxyInstances {
  message Request {
    Paging paging = 1;
  }
  message Response {
    repeated HaproxyInstance instances = 1;
    uint64 total = 2;
    repeated ProvisioningTask provisioning = 3;
  }
}

message DropHaproxyInstance {
  message Request {
    string name = 1;
  }
  message Response {
    string entity_id = 1;
    string action = 2;
  }
}

message SelectHaproxyMaster {
  message Request {
    string name = 1;
    string master_pg_instance = 2;
  }
  message Response {
    string entity_id = 1;
    string action = 2;
  }
}
