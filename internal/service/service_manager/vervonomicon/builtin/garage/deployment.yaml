app:
  image: dxflrs/garage:v2.4.0
  ports:
    - port: 3900
      protocol: tcp
    - port: 3903
      protocol: tcp
  volumes:
    - name: garage-meta
      path: /var/lib/garage/meta
    - name: garage-data
      path: /var/lib/garage/data
  healthcheck:
    exec: ["/garage", "status"]
    interval_second: 2
    timeout_second: 5
    retries: 30
  restart: unless_stopped
  box: small
