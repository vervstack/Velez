syntax = "proto3";

package velez_api;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "npm.proto";

import "velez_api.proto";
import "velez_common.proto";

option go_package = "go.vervstack.ru/velez/pkg/velez_api;velez_api";
option (npm_package) = "@vervstack/velez";

service ControlPlaneAPI {
  rpc EnablePlugin(EnablePlugin.Request) returns (EnablePlugin.Response) {
    option (google.api.http) = {
      post: "/api/control_plane/plugin/enable"
      body: "*"
    };
  }

  // ConnectSlave - used by other Velez nodes to connect to cluster
  rpc ConnectSlave(ConnectSlave.Request) returns (ConnectSlave.Response) {
    option (google.api.http) = {
      post: "/api/control_plane/slave/connect"
      body: "*"
    };
  }

  rpc ListNodes(ListNodes.Request) returns (ListNodes.Response) {
    option (google.api.http) = {
      post: "/api/control_plane/nodes/list"
      body: "*"
    };
  }

  rpc ListPlugins(ListPlugins.Request) returns (ListPlugins.Response) {
    option (google.api.http) = {
      get: "/api/control_plane/plugins"
    };
  }

  rpc ListEnvironments(ListEnvironments.Request) returns (ListEnvironments.Response) {
    option (google.api.http) = {
      post: "/api/control_plane/environments/list"
      body: "*"
    };
  }

  rpc CreateEnvironment(CreateEnvironment.Request) returns (CreateEnvironment.Response) {
    option (google.api.http) = {
      post: "/api/control_plane/environments/create"
      body: "*"
    };
  }

  rpc UpdateEnvironment(UpdateEnvironment.Request) returns (UpdateEnvironment.Response) {
    option (google.api.http) = {
      post: "/api/control_plane/environments/update"
      body: "*"
    };
  }

  rpc DeleteEnvironment(DeleteEnvironment.Request) returns (DeleteEnvironment.Response) {
    option (google.api.http) = {
      post: "/api/control_plane/environments/delete"
      body: "*"
    };
  }

  rpc ListRegistries(ListRegistries.Request) returns (ListRegistries.Response) {
    option (google.api.http) = {
      post: "/api/control_plane/registries/list"
      body: "*"
    };
  }

  rpc CreateRegistry(CreateRegistry.Request) returns (CreateRegistry.Response) {
    option (google.api.http) = {
      post: "/api/control_plane/registries/create"
      body: "*"
    };
  }

  rpc UpdateRegistry(UpdateRegistry.Request) returns (UpdateRegistry.Response) {
    option (google.api.http) = {
      post: "/api/control_plane/registries/update"
      body: "*"
    };
  }

  rpc DeleteRegistry(DeleteRegistry.Request) returns (DeleteRegistry.Response) {
    option (google.api.http) = {
      post: "/api/control_plane/registries/delete"
      body: "*"
    };
  }
}

message ListVervPlugins {
  message Request {

  }
  message Response {
    repeated VervPlugin plugins = 1;
  }
}


message VervPlugin  {
  VervPluginType type = 1;
  optional uint32 port = 2;
  State state = 3;

  enum State {
    unknown = 0;
    running = 1;
    warning = 2;
    dead = 3;
    disabled = 4;
  }
}

enum VervPluginType {
  unknown_service_type = 0;
  matreshka = 1;
  makosh = 2;

  webserver = 3;
  headscale = 4;

  portainer = 5;

  statefull_pg = 6;

  registry = 7;
}

enum RegistryType {
  REGISTRY_TYPE_UNSPECIFIED = 0;
  REGISTRY_TYPE_DOCKERHUB = 1;
  REGISTRY_TYPE_GENERIC_V2 = 2;
}

message EnablePlugin {
  message Request {
    VervPluginType plugin = 1;
    oneof payload {
      EnableStatefullCluster statefull_cluster = 2;
      EnableHeadscaleServer headscale_server = 3;
      EnableRegistry registry = 4;
    }
  }

  message Response {
    string entity_id = 1;
    string action = 2;
  }
}

message InitMaster {
  message Request{};

  message Response{};
}

message ConnectSlave {
  message Request {}

  message Response {}
}


message EnableStatefullCluster {
  optional bool is_expose_port = 1;
  optional uint64 expose_to_port = 2;
}

message EnableRegistry {
  optional uint32 expose_to_port = 1;
  optional string username = 2;
}

message EnableHeadscaleServer {
  oneof payload {
    DeployHeadscaleConfig deploy_config = 1;
    ExternalHeadscaleConnection external_connect = 2;
  }

  message ExternalHeadscaleConnection {
    string url = 1;
    string token = 2;
  }

  message DeployHeadscaleConfig {
    // Headscale must export any port.
    // Using custom_port allows you to specify the port to expose to
    optional uint32 custom_port = 1;
    // Using custom_image you can specify the exact image to deploy
    optional string custom_image = 2;
  }
}

message ListNodes {
  message Request {
    Paging paging = 1;
  }
  message Response {
    repeated NodeBaseInfo nodes = 1;
    uint64 total = 2;
  }
}

message Plugin {
  VervPluginType type = 1;
  VervPlugin.State state = 2;
  string service_name = 3;
  repeated int64 node_ids = 4;
  optional int64 master_node_id = 5;
}

message ListPlugins {
  message Request {}
  message Response {
    repeated Plugin plugins = 1;
  }
}

message Environment {
  int64 id = 1;
  string name = 2;
  string suffix = 3;
  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
  string docker_host = 6;
}

message ListEnvironments {
  message Request {}
  message Response {
    repeated Environment environments = 1;
  }
}

message CreateEnvironment {
  message Request {
    string name = 1;
    optional string suffix = 2;
    optional string docker_host = 3;
  }
  message Response {
    Environment environment = 1;
  }
}

message UpdateEnvironment {
  message Request {
    int64 id = 1;
    optional string name = 2;
    optional string suffix = 3;
    optional string docker_host = 4;
  }
  message Response {
    Environment environment = 1;
  }
}

message DeleteEnvironment {
  message Request {
    optional int64 id = 1;
    optional string name = 2;
  }
  message Response {}
}

message Registry {
  int64 id = 1;
  string name = 2;
  RegistryType type = 3;
  string url = 4;
  string username = 5;
  bool is_default = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message ListRegistries {
  message Request {}
  message Response {
    repeated Registry registries = 1;
  }
}

message CreateRegistry {
  message Request {
    string name = 1;
    RegistryType type = 2;
    optional string url = 3;
    optional string username = 4;
    optional string secret = 5;
    optional bool is_default = 6;
  }
  message Response {
    Registry registry = 1;
  }
}

message UpdateRegistry {
  message Request {
    int64 id = 1;
    optional string name = 2;
    optional RegistryType type = 3;
    optional string url = 4;
    optional string username = 5;
    optional string secret = 6;
    optional bool is_default = 7;
  }
  message Response {
    Registry registry = 1;
  }
}

message DeleteRegistry {
  message Request {
    optional int64 id = 1;
    optional string name = 2;
  }
  message Response {}
}