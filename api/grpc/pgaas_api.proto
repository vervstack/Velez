syntax = "proto3";

package velez_api;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "npm.proto";

import "velez_common.proto";

option go_package = "go.vervstack.ru/velez/pkg/velez_api;velez_api";
option (npm_package) = "@vervstack/velez";

// PostgresAPI - Postgres-as-a-Service. A PG instance is a normal Velez
// service (velez.services / deployment_specifications / deployments), with
// only the pg-specific facts (db_name, username, secret_ref, port) held in
// velez.pg_instances. See docs/features/pgaas_and_registry_plugin.md
// section 3.
service PostgresAPI {
  rpc ListPgInstances(ListPgInstances.Request) returns (ListPgInstances.Response) {
    option (google.api.http) = {
      post: "/api/postgres/list"
      body: "*"
    };
  }

  rpc CreatePgInstance(CreatePgInstance.Request) returns (CreatePgInstance.Response) {
    option (google.api.http) = {
      post: "/api/postgres/create"
      body: "*"
    };
  }

  rpc DropPgInstance(DropPgInstance.Request) returns (DropPgInstance.Response) {
    option (google.api.http) = {
      post: "/api/postgres/drop"
      body: "*"
    };
  }

  rpc ReplicatePgDatabase(ReplicatePgDatabase.Request) returns (ReplicatePgDatabase.Response) {
    option (google.api.http) = {
      post: "/api/postgres/replicate"
      body: "*"
    };
  }

  rpc EnablePgReplication(EnablePgReplication.Request) returns (EnablePgReplication.Response) {
    option (google.api.http) = {
      post: "/api/postgres/enable-replication"
      body: "*"
    };
  }

  rpc SetupPgReplication(SetupPgReplication.Request) returns (SetupPgReplication.Response) {
    option (google.api.http) = {
      post: "/api/postgres/setup-replication"
      body: "*"
    };
  }

  rpc GetPgReplicationStatus(GetPgReplicationStatus.Request) returns (GetPgReplicationStatus.Response) {
    option (google.api.http) = {
      post: "/api/postgres/replication-status"
      body: "*"
    };
  }

  // GetPgInstanceCredentials is the only RPC that resolves a secret_ref to
  // its value.
  rpc GetPgInstanceCredentials(GetPgInstanceCredentials.Request) returns (GetPgInstanceCredentials.Response) {
    option (google.api.http) = {
      get: "/api/postgres/{name}/credentials"
    };
  }
}

// PgInstanceIsolation - isolation mode for a PG instance. Only
// PG_INSTANCE_ISOLATION_SEPARATE_INSTANCE is provisionable today -
// PG_INSTANCE_ISOLATION_SHARED_POOL is surfaced disabled in the UI. See
// docs/features/pgaas_and_registry_plugin.md section 3, "Isolation".
enum PgInstanceIsolation {
  PG_INSTANCE_ISOLATION_UNSPECIFIED = 0;
  PG_INSTANCE_ISOLATION_SEPARATE_INSTANCE = 1;
  PG_INSTANCE_ISOLATION_SHARED_POOL = 2;
}

// PgInstance never carries a password - status, environment, image,
// container id and deploy history live on the underlying service/deployment
// rows and are read via ListSmerds/VervServicesService, not duplicated here.
message PgInstance {
  string name = 1;
  string db_name = 2;
  string username = 3;
  uint32 port = 4;
  string environment = 5;
  string status = 6;
  optional string owner_service = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // display_name - the instance name without its storage-layer prefix (pgaas_/s3_/cr_); falls back to name
  string display_name = 10;
  // exposed_port - host-side published port of the container's `port`; absent when not published
  optional uint32 exposed_port = 11;
}

message ListPgInstances {
  message Request {
    Paging paging = 1;
  }
  message Response {
    repeated PgInstance instances = 1;
    uint64 total = 2;
    repeated ProvisioningTask provisioning = 3;
  }
}

message CreatePgInstance {
  message Request {
    string name = 1;
    optional string environment = 2;
    optional string box = 3;
    optional uint32 expose_to_port = 4;
    // owner_service - when set, a velez.service_resources binding is
    // recorded (owner_service, name, "postgres") once the instance is
    // created.
    optional string owner_service = 5;
  }
  message Response {
    // instance is never populated - the RPC enqueues the
    // create_pg_instance task and returns before it completes.
    // Callers watch entity_id/action via TasksApi.WatchTask and refetch
    // ListPgInstances once the task reaches DONE.
    PgInstance instance = 1;
    string entity_id = 2;
    string action = 3;
  }
}

message DropPgInstance {
  message Request {
    string name = 1;
  }
  message Response {
    // The RPC enqueues the drop task and returns before it completes.
    // Callers watch entity_id/action via TasksApi.WatchTask and refetch the list once the task reaches DONE.
    string entity_id = 1;
    string action = 2;
  }
}

message EnablePgReplication {
  message Request {
    string name = 1;
  }
  message Response {
    string entity_id = 1;
    string action = 2;
  }
}

message SetupPgReplication {
  message Request {
    string source_instance = 1;
    string target_instance = 2;
    bool use_slot = 3;
    string mode = 4;
  }
  message Response {
    string entity_id = 1;
    string action = 2;
  }
}

message GetPgReplicationStatus {
  message Request {
    string instance = 1;
  }
  message Response {
    bool is_replica = 1;
    repeated ReplicaStatus replicas = 2;
    string upstream = 3;
    bool in_recovery = 4;
    bool in_sync = 5;
  }
  message ReplicaStatus {
    string application_name = 1;
    string state = 2;
    int64 lag_bytes = 3;
    float replay_lag_seconds = 4;
    bool in_sync = 5;
  }
}

message ReplicatePgDatabase {
  message Request {
    // Source and target intentionally use flat optional fields: task payloads
    // are persisted through encoding/json and cannot safely contain oneof.
    string source_instance_id = 1;
    string source_host = 2;
    uint32 source_port = 3;
    string source_user = 4;
    string source_password = 5;
    string source_db_name = 6;
    string target_instance_id = 7;
    string target_host = 8;
    uint32 target_port = 9;
    string target_user = 10;
    string target_password = 11;
  }
  message Response {
    string entity_id = 1;
    string action = 2;
  }
}

message PgConnection {
  string dsn = 1;
  // masked_dsn - same string with the password replaced by ••••
  string masked_dsn = 2;
}

// GetPgInstanceCredentials.Response is the only PostgresAPI message that
// ever carries a password.
message GetPgInstanceCredentials {
  message Request {
    string name = 1;
  }
  message Response {
    string db_name = 1;
    string username = 2;
    string password = 3;
    string dsn = 4;
    PgConnection in_network = 5;
    // external - host-reachable form (node host : exposed port); absent when the port is not published
    optional PgConnection external = 6;
  }
}
