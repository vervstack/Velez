syntax = "proto3";

package velez_api;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "npm.proto";

import "velez_common.proto";

option go_package = "go.vervstack.ru/velez/pkg/velez_api;velez_api";
option (npm_package) = "@vervstack/velez";

// RunnersAPI - Runners-as-a-Service. A runner is a normal Velez service
// (velez.services / deployment_specifications / deployments), with only the
// runner-specific facts (provider, scope, target, labels, secret_ref) held in
// velez.runners. Git-agnostic by design: GitHub Actions is the first
// RunnerProvider, GitLab and others are additional providers under this same
// contract, not separate contracts. Structured after PostgresAPI.
service RunnersAPI {
  rpc ListRunners(ListRunners.Request) returns (ListRunners.Response) {
    option (google.api.http) = {
      post: "/api/runners/list"
      body: "*"
    };
  }

  rpc CreateRunner(CreateRunner.Request) returns (CreateRunner.Response) {
    option (google.api.http) = {
      post: "/api/runners/create"
      body: "*"
    };
  }

  rpc DropRunner(DropRunner.Request) returns (DropRunner.Response) {
    option (google.api.http) = {
      post: "/api/runners/drop"
      body: "*"
    };
  }

  // ReregisterRunner unregisters and re-registers the runner's existing
  // container in place, reusing its already-stored registration token - no
  // new token minted, no new container deployed. A no-op unregister/register
  // for a self-registering provider (GitHub).
  rpc ReregisterRunner(ReregisterRunner.Request) returns (ReregisterRunner.Response) {
    option (google.api.http) = {
      post: "/api/runners/reregister"
      body: "*"
    };
  }

  // GetRunnerCredentials is the only RPC that resolves a secret_ref to its
  // value.
  rpc GetRunnerCredentials(GetRunnerCredentials.Request) returns (GetRunnerCredentials.Response) {
    option (google.api.http) = {
      get: "/api/runners/{name}/credentials"
    };
  }

  // GetRunnerConfig reads the runner's currently stored provider config
  // (base_url, docker_image, docker_socket_address) - the values the next
  // ReregisterRunner/RedeployRunner call will apply, not necessarily what
  // the running container was deployed with. pull_policy,
  // allowed_pull_policies, check_interval, log_level and shutdown_timeout are
  // the exception: they are read live from the runner's config.toml.
  rpc GetRunnerConfig(GetRunnerConfig.Request) returns (GetRunnerConfig.Response) {
    option (google.api.http) = {
      get: "/api/runners/{name}/config"
    };
  }

  // UpdateRunnerConfig persists new provider config values. It never applies
  // them to the running container - the response tells the caller which
  // follow-up action does: requires_reregister (base_url/docker_image, via
  // ReregisterRunner) and/or requires_redeploy (docker_socket_address, via
  // RedeployRunner). pull_policy, allowed_pull_policies, check_interval,
  // log_level and shutdown_timeout apply immediately to the runner's
  // config.toml and need neither.
  rpc UpdateRunnerConfig(UpdateRunnerConfig.Request) returns (UpdateRunnerConfig.Response) {
    option (google.api.http) = {
      post: "/api/runners/update_config"
      body: "*"
    };
  }

  // RedeployRunner recreates the runner's container from its current stored
  // deployment spec, overlaying docker_socket_address as DOCKER_HOST (or
  // clearing it back to unset) - the only way a docker_socket_address change
  // ever reaches the container, since it's a deploy-time env var, not
  // something a running container can pick up. Mirrors ReregisterRunner's
  // fire-and-forget shape.
  rpc RedeployRunner(RedeployRunner.Request) returns (RedeployRunner.Response) {
    option (google.api.http) = {
      post: "/api/runners/redeploy"
      body: "*"
    };
  }
}

// RunnerProvider - which CI system a runner registers against. GITHUB
// self-registers fully from env vars; GITLAB registers via an automated
// `gitlab-runner register` exec against the deployed container. Others are
// added here as new values later, never as new contracts.
enum RunnerProvider {
  RUNNER_PROVIDER_UNSPECIFIED = 0;
  GITHUB = 1;
  GITLAB = 2;
}

// RunnerScope - the scope a self-hosted runner registers under: a single
// repository, or an entire organization/group. Generalizes across providers
// (GitHub repo/org, GitLab project/group).
enum RunnerScope {
  RUNNER_SCOPE_UNSPECIFIED = 0;
  REPO = 1;
  ORG = 2;
}

// RunnerPullPolicy - gitlab-runner docker executor pull_policy value.
enum RunnerPullPolicy {
  RUNNER_PULL_POLICY_UNSPECIFIED = 0;
  RUNNER_PULL_POLICY_ALWAYS = 1;
  RUNNER_PULL_POLICY_IF_NOT_PRESENT = 2;
  RUNNER_PULL_POLICY_NEVER = 3;
}

// RunnerLogLevel - gitlab-runner global log_level value.
enum RunnerLogLevel {
  RUNNER_LOG_LEVEL_UNSPECIFIED = 0;
  RUNNER_LOG_LEVEL_DEBUG = 1;
  RUNNER_LOG_LEVEL_INFO = 2;
  RUNNER_LOG_LEVEL_WARN = 3;
  RUNNER_LOG_LEVEL_ERROR = 4;
  RUNNER_LOG_LEVEL_FATAL = 5;
  RUNNER_LOG_LEVEL_PANIC = 6;
}

// RunnerPullPolicies wraps a repeated field so UpdateRunnerConfig can tell "unset" from "clear".
message RunnerPullPolicies {
  repeated RunnerPullPolicy values = 1;
}

// Runner never carries its access token - status and environment live on the
// underlying service/deployment rows and are read via ListSmerds/
// VervServicesService, not duplicated here.
message Runner {
  string name = 1;
  RunnerProvider provider = 2;
  RunnerScope scope = 3;

  // target - the repo ("owner/repo") or org ("owner") the runner registers
  // against, per scope.
  string target = 4;

  repeated string labels = 5;
  string environment = 6;
  string status = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message ListRunners {
  message Request {
    Paging paging = 1;
  }
  message Response {
    repeated Runner runners = 1;
    uint64 total = 2;
    repeated ProvisioningTask provisioning = 3;
  }
}

message CreateRunner {
  message Request {
    string name = 1;
    RunnerScope scope = 2;
    string target = 3;
    repeated string labels = 4;
    optional string environment = 5;

    // docker_socket_address - tcp:// address of a Docker daemon this runner
    // should talk to (set as DOCKER_HOST env) instead of the default host
    // socket. unix:// and bare paths are rejected: no caller-supplied value
    // may ever become a bind-mount source, so it can never be pointed at
    // Velez's own host socket. Empty means Velez grants the host socket via
    // its existing internal-only bind-mount gate - full root access, the
    // current default behavior.
    optional string docker_socket_address = 6;

    oneof provider_config {
      GithubConfig github = 7;
      GitlabConfig gitlab = 8;
    }

    // dind_name - name of a DinD service (DindAPI) the runner uses as its Docker daemon. New runners must set exactly one of dind_name or docker_socket_address; neither is rejected.
    optional string dind_name = 9;
  }
  message Response {
    // runner is never populated - the RPC enqueues the create_runner task
    // and returns before it completes. Callers watch entity_id/action via
    // TasksApi.WatchTask and refetch ListRunners once the task reaches DONE.
    Runner runner = 1;
    string entity_id = 2;
    string action = 3;
  }
}

// GithubConfig - GitHub Actions-specific CreateRunner body.
message GithubConfig {
  // access_token - a GitHub PAT with permission to mint a runner
  // registration token for target. Never stored as given; see
  // internal/service/secrets.
  string access_token = 1;
}

// GitlabConfig - GitLab-specific CreateRunner body. access_token is trusted
// as an already-valid registration token (GitLab's own minting API is
// deprecated/disabled on modern instances, see runneraas/providers/gitlab),
// then handed to `gitlab-runner register`, run automatically against the
// deployed container.
message GitlabConfig {
  // access_token - a GitLab runner registration token for target (project or
  // group), created by the caller ahead of time. Never stored as given; see
  // internal/service/secrets.
  string access_token = 1;

  // base_url - the GitLab instance's base URL, e.g. "https://gitlab.com" or
  // a self-managed instance's URL. Empty defaults to "https://gitlab.com".
  optional string base_url = 2;

  // docker_image - the image `gitlab-runner register`'s docker executor uses
  // for job containers (--docker-image). Empty defaults to "alpine:3.24.2".
  // The executor itself is always "docker" - not caller-configurable.
  optional string docker_image = 3;

  // concurrent - the global gitlab-runner `concurrent` setting: how many jobs
  // the runner runs at once. Unset defaults to 1.
  optional int32 concurrent = 4;
}

// GetRunnerConfig.Response never carries a token - see GetRunnerCredentials.
message GetRunnerConfig {
  message Request {
    string name = 1;
  }
  message Response {
    string base_url = 1;
    string docker_image = 2;
    string docker_socket_address = 3;
    int32 concurrent = 4;
    // The fields below are read live from the runner's config.toml;
    // empty / 0 / UNSPECIFIED means the key is unset.
    // pull_policy - ordered fallback chain.
    repeated RunnerPullPolicy pull_policy = 5;
    repeated RunnerPullPolicy allowed_pull_policies = 6;
    int32 check_interval = 7;
    RunnerLogLevel log_level = 8;
    int32 shutdown_timeout = 9;
  }
}

message UpdateRunnerConfig {
  message Request {
    string name = 1;

    // Only a field the caller actually sets is persisted; each also decides
    // one bit of the response - see GetRunnerConfig.Response's doc comment
    // for what each value means.
    optional string base_url = 2;
    optional string docker_image = 3;
    // docker_socket_address - same tcp://-only validation as
    // CreateRunner.Request.docker_socket_address. Setting it to "" clears it
    // back to the default host socket grant.
    optional string docker_socket_address = 4;
    // concurrent - must be at least 1. Unlike the other fields it is applied
    // to the running container immediately.
    optional int32 concurrent = 5;

    // The fields below are applied live to config.toml and never stored in
    // the DB. A set field with an empty list / 0 / UNSPECIFIED clears the key.
    optional RunnerPullPolicies pull_policy = 6;
    optional RunnerPullPolicies allowed_pull_policies = 7;
    optional int32 check_interval = 8;
    optional RunnerLogLevel log_level = 9;
    optional int32 shutdown_timeout = 10;
  }
  message Response {
    // requires_reregister - true when base_url and/or docker_image was set;
    // apply by calling ReregisterRunner.
    bool requires_reregister = 1;
    // requires_redeploy - true when docker_socket_address was set; apply by
    // calling RedeployRunner.
    bool requires_redeploy = 2;
  }
}

message RedeployRunner {
  message Request {
    string name = 1;
  }
  message Response {
    string entity_id = 1;
    string action = 2;
  }
}

message DropRunner {
  message Request {
    string name = 1;
  }
  message Response {
    // The RPC enqueues the drop task and returns before it completes.
    // Callers watch entity_id/action via TasksApi.WatchTask and refetch the list once the task reaches DONE.
    string entity_id = 1;
    string action = 2;
  }
}

message ReregisterRunner {
  message Request {
    string name = 1;
  }
  message Response {
    string entity_id = 1;
    string action = 2;
  }
}

// GetRunnerCredentials.Response is the only RunnersAPI message that ever
// carries a token.
message GetRunnerCredentials {
  message Request {
    string name = 1;
  }
  message Response {
    // token - the provider registration token stored at CreateRunner time
    // (GitHub: minted from the caller's PAT; GitLab: the caller's access
    // token, trusted as-is). Not re-mintable through this RPC; it reflects
    // the token stored then.
    string token = 1;
    // target - the repo/org (or project/group) the token registers against.
    string target = 2;
    RunnerProvider provider = 3;
    reserved 4;
    reserved "register_command";
  }
}
