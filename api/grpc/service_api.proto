syntax = "proto3";

package velez_api;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

import "npm.proto";
import "velez_common.proto";
import "velez_api.proto";

option go_package = "go.vervstack.ru/velez/pkg/velez_api;velez_api";
option (npm_package) = "@vervstack/velez";

service ServiceApi {
  rpc CreateService(CreateService.Request) returns (CreateService.Response) {
    option (google.api.http) = {
      post: "/api/service/create"
      body: "*"
    };
  }

  rpc GetService(GetService.Request) returns (GetService.Response) {
    option (google.api.http) = {
      post: "/api/service/get"
      body: "*"
    };
  }

  // CreateDeploy - create new deployment specification
  // and prepares to deploy service
  // updating specification is prohibited by design.
  // New deployment - new specification
  // Instance update goes gradually.
  // When new instances are deployed,
  // the old one stops receive traffic and
  // become obsolete (schedules to be deleted)
  rpc CreateDeploy(CreateDeploy.Request) returns (CreateDeploy.Response) {
    option (google.api.http) = {
      post: "/api/service/deploy/create"
      body: "*"
    };
  }

  rpc ListDeployments(ListDeployments.Request) returns (ListDeployments.Response) {
    option (google.api.http) = {
      post: "/api/service/deploy/list"
      body: "*"
    };
  }

  rpc ListServices(ListServices.Request) returns (ListServices.Response) {
    option (google.api.http) = {
      post: "/api/service/list"
      body: "*"
    };
  }

  rpc StopService(StopService.Request) returns (StopService.Response) {
    option (google.api.http) = {
      post: "/api/service/stop"
      body: "*"
    };
  }

  rpc RestartService(RestartService.Request) returns (RestartService.Response) {
    option (google.api.http) = {
      post: "/api/service/restart"
      body: "*"
    };
  }

  rpc GetServiceMetrics(GetServiceMetrics.Request) returns (GetServiceMetrics.Response) {
    option (google.api.http) = {
      post: "/api/service/metrics"
      body: "*"
    };
  }

  rpc GetServiceResources(GetServiceResources.Request) returns (GetServiceResources.Response) {
    option (google.api.http) = {
      post: "/api/service/resources"
      body: "*"
    };
  }

  rpc GetServiceGraph(GetServiceGraph.Request) returns (GetServiceGraph.Response) {
    option (google.api.http) = {
      post: "/api/service/graph"
      body: "*"
    };
  }

  rpc GetServiceEnvironments(GetServiceEnvironments.Request) returns (GetServiceEnvironments.Response) {
    option (google.api.http) = {
      post: "/api/service/environments"
      body: "*"
    };
  }

  rpc GetVervonomicon(GetVervonomicon.Request) returns (GetVervonomicon.Response) {
    option (google.api.http) = {
      post: "/api/service/vervonomicon"
      body: "*"
    };
  }
}

message CreateService {
  message Request {
    string name = 1;
  }

  message Response {}
}


message GetService {
  message Request {
    string name = 1;
  }

  message Response {
    oneof payload {
      VervAppService verv_service = 1;
      // in future there might be other service types that needs to be managed
    }
  }
}

message VervAppService {
  string name = 2;
  optional uint64 current_deployment_id = 3;
  DeploymentStatus status = 4;
}

message CreateDeploy {
  message Request {
    oneof specification {
      // Creates new deployment specification
      CreateSmerd.Request new = 1;
      // Takes current version and upgrades
      // only certain part of it (image)
      Upgrade upgrade = 2;
    }

    string service_name = 3;

    message Upgrade {
      // Id of deployment from which to perform upgrade from
      uint64 deployment_id = 1;

      // Options to upgrade from. All optional.
      // If none is passed - simply creates new deployment
      // and restarts smerds
      optional string image = 2;
    }
  }

  message Response {}
}

enum DeploymentStatus {
  DEPLOYMENT_STATUS_UNKNOWN = 0;
  SCHEDULED_DEPLOYMENT = 1;
  SCHEDULED_DELETION = 2;
  SCHEDULED_UPGRADE = 3;
  RUNNING = 4;
  FAILED = 5;
  DELETED = 6;
  STOPPED = 7;
}

message DeploymentInfo {
  uint64 id = 1;
  DeploymentStatus status = 2;
  uint64 spec_id = 3;
  google.protobuf.Timestamp created_at = 4;
  optional string image = 5;
  optional string triggered_by = 6;
  optional string image_digest = 7;
}

message ListDeployments {
  message Request {
    Paging paging = 1;

    optional string service_name = 2;
  }
  message Response {
    repeated DeploymentInfo deployments = 1;
    uint64 total = 2;
  }
}

message ListServices {
  message Request {
    Paging paging = 1;

    optional string search_pattern = 2;
  };
  message Response {
    uint64 Total = 1;
    repeated ServiceBaseInfo services = 2;
  };
}

message ServiceBaseInfo {
  string name = 1;
  google.protobuf.Timestamp last_deployed_at = 2;
  string image_name = 3;  // primary container image (imageName from latest smerd)
  string status = 4;      // running | degraded | stopped — derived from smerd status
  string env = 5;         // value of the 'env' label if set, else empty
}

message StopService {
  message Request {
    string name = 1;
  }
  message Response {}
}

message RestartService {
  message Request {
    string name = 1;
  }
  message Response {}
}

message GetServiceMetrics {
  message Request {
    string service_name = 1;
  }
  message Response {
    double cpu_percent = 1;
    uint64 mem_mi = 2;
    uint64 mem_max_mi = 3;
    uint32 replicas_running = 4;
    uint32 replicas_desired = 5;
    uint64 uptime_seconds = 6;
  }
}

message BoundResource {
  string name = 1;
  string resource_type = 2;
  string status = 3;
}

message GetServiceResources {
  message Request {
    string service_name = 1;
  }
  message Response {
    repeated BoundResource resources = 1;
  }
}

message ServiceDependencyInfo {
  string service_name = 1;
  string proto = 2;
  double request_rate = 3;
}

message GetServiceGraph {
  message Request {
    string service_name = 1;
  }
  message Response {
    repeated ServiceDependencyInfo callers = 1;
    repeated ServiceDependencyInfo dependencies = 2;
  }
}

message ServiceEnvironmentInfo {
  string env = 1;
  string status = 2;
  string deployed_version = 3;
  google.protobuf.Timestamp deployed_at = 4;
  string health = 5;
}

message GetServiceEnvironments {
  message Request {
    string service_name = 1;
  }
  message Response {
    repeated ServiceEnvironmentInfo environments = 1;
  }
}

message GetVervonomicon {
  message Request {
    string service_name = 1;
  }
  message Response {}
}

