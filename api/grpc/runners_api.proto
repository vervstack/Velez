syntax = "proto3";

package velez_api;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "npm.proto";

import "velez_common.proto";

option go_package = "go.vervstack.ru/velez/pkg/velez_api;velez_api";
option (npm_package) = "@vervstack/velez";

// RunnersAPI - Runners-as-a-Service. A runner is a normal Velez service
// (velez.services / deployment_specifications / deployments), with only the
// runner-specific facts (provider, scope, target, labels, secret_ref) held in
// velez.runners. Git-agnostic by design: GitHub Actions is the first
// RunnerProvider, GitLab and others are additional providers under this same
// contract, not separate contracts. Structured after PostgresAPI.
service RunnersAPI {
  rpc ListRunners(ListRunners.Request) returns (ListRunners.Response) {
    option (google.api.http) = {
      post: "/api/runners/list"
      body: "*"
    };
  }

  rpc CreateRunner(CreateRunner.Request) returns (CreateRunner.Response) {
    option (google.api.http) = {
      post: "/api/runners/create"
      body: "*"
    };
  }

  rpc DropRunner(DropRunner.Request) returns (DropRunner.Response) {
    option (google.api.http) = {
      post: "/api/runners/drop"
      body: "*"
    };
  }

  // GetRunnerCredentials is the only RPC that resolves a secret_ref to its
  // value. GitLab runners register manually in v1 (the official
  // gitlab/gitlab-runner image doesn't self-register from env vars alone),
  // so the response also carries the exact `gitlab-runner register` command
  // the caller runs by hand.
  rpc GetRunnerCredentials(GetRunnerCredentials.Request) returns (GetRunnerCredentials.Response) {
    option (google.api.http) = {
      get: "/api/runners/{name}/credentials"
    };
  }
}

// RunnerProvider - which CI system a runner registers against. GITHUB
// self-registers fully from env vars; GITLAB is provisioned as a bare
// official-image container and registers manually in v1 (see
// GetRunnerCredentials). Others are added here as new values later, never as
// new contracts.
enum RunnerProvider {
  RUNNER_PROVIDER_UNSPECIFIED = 0;
  GITHUB = 1;
  GITLAB = 2;
}

// RunnerScope - the scope a self-hosted runner registers under: a single
// repository, or an entire organization/group. Generalizes across providers
// (GitHub repo/org, GitLab project/group).
enum RunnerScope {
  RUNNER_SCOPE_UNSPECIFIED = 0;
  REPO = 1;
  ORG = 2;
}

// Runner never carries its access token - status and environment live on the
// underlying service/deployment rows and are read via ListSmerds/
// VervServicesService, not duplicated here.
message Runner {
  string name = 1;
  RunnerProvider provider = 2;
  RunnerScope scope = 3;

  // target - the repo ("owner/repo") or org ("owner") the runner registers
  // against, per scope.
  string target = 4;

  repeated string labels = 5;
  string environment = 6;
  string status = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message ListRunners {
  message Request {
    Paging paging = 1;
  }
  message Response {
    repeated Runner runners = 1;
    uint64 total = 2;
  }
}

message CreateRunner {
  message Request {
    string name = 1;
    RunnerScope scope = 2;
    string target = 3;
    repeated string labels = 4;
    optional string environment = 5;

    // docker_socket_address - tcp:// address of a Docker daemon this runner
    // should talk to (set as DOCKER_HOST env) instead of the default host
    // socket. unix:// and bare paths are rejected: no caller-supplied value
    // may ever become a bind-mount source, so it can never be pointed at
    // Velez's own host socket. Empty means Velez grants the host socket via
    // its existing internal-only bind-mount gate - full root access, the
    // current default behavior.
    optional string docker_socket_address = 6;

    oneof provider_config {
      GithubConfig github = 7;
      GitlabConfig gitlab = 8;
    }
  }
  message Response {
    // runner is never populated - the RPC enqueues the create_runner task
    // and returns before it completes. Callers watch entity_id/action via
    // TasksApi.WatchTask and refetch ListRunners once the task reaches DONE.
    Runner runner = 1;
    string entity_id = 2;
    string action = 3;
  }
}

// GithubConfig - GitHub Actions-specific CreateRunner body.
message GithubConfig {
  // access_token - a GitHub PAT with permission to mint a runner
  // registration token for target. Never stored as given; see
  // internal/service/secrets.
  string access_token = 1;
}

// GitlabConfig - GitLab-specific CreateRunner body. v1 provisions a bare
// official gitlab/gitlab-runner container and stops there - there is no
// automated `gitlab-runner register` step, so access_token is trusted as an
// already-valid registration token and surfaced back via
// GetRunnerCredentials, not used to call any GitLab API.
message GitlabConfig {
  // access_token - a GitLab runner registration token for target (project or
  // group), created by the caller ahead of time. Never stored as given; see
  // internal/service/secrets.
  string access_token = 1;

  // base_url - the GitLab instance's base URL, e.g. "https://gitlab.com" or
  // a self-managed instance's URL. Empty defaults to "https://gitlab.com".
  optional string base_url = 2;
}

message DropRunner {
  message Request {
    string name = 1;
  }
  message Response {}
}

// GetRunnerCredentials.Response is the only RunnersAPI message that ever
// carries a token. GitLab runners aren't auto-registered in v1, so the
// response also hands back the exact command to run against the running
// container to finish registration by hand.
message GetRunnerCredentials {
  message Request {
    string name = 1;
  }
  message Response {
    // token - the provider registration token stored at CreateRunner time
    // (GitHub: minted from the caller's PAT; GitLab: the caller's access
    // token, trusted as-is in v1). Not re-mintable through this RPC; it
    // reflects the token stored then.
    string token = 1;
    // target - the repo/org (or project/group) the token registers against.
    string target = 2;
    RunnerProvider provider = 3;
    // register_command - populated only for providers with no automated
    // registration step (GitLab in v1); empty for a self-registering
    // provider like GitHub.
    string register_command = 4;
  }
}
