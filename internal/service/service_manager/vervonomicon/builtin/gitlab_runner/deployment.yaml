app:
  # image is set explicitly, unlike a normal service descriptor - this
  # descriptor is embedded into the Velez binary itself
  # (SourceKindBuiltin), not baked into an image, so there is nothing for
  # Velez to inspect .verv/ out of. The official image is used unmodified -
  # no custom entrypoint/wrapper image - per the deliberate v1 decision to
  # start with a bare container and grow automation later.
  image: gitlab/gitlab-runner:latest

  # The runner is not registered by exec: Velez renders config.toml and seeds
  # it into the /etc/gitlab-runner volume before the first start, so the
  # container comes up already configured. No env vars, no ports and
  # deliberately no healthcheck - the image entrypoint is
  # `dumb-init /entrypoint`, which execs `gitlab-runner run` (default CMD
  # `run --user=gitlab-runner --working-directory=/home/gitlab-runner`).
  volumes:
    - name: gitlab-runner-data
      path: /etc/gitlab-runner

  restart: unless_stopped

  box: small
