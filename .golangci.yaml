version: "2"

run:
  timeout: 5m
  issues-exit-code: 42

output:
  formats:
    colored-line-number: { }


linters-settings:
  varnamelen: # scope of variable
    max-distance: 25 # amount of lines when variable can be used (about 1 screen space)
    min-name-length: 2 # minimal lenght of variable that goes out of scope

    ignore-type-assert-ok: true
    check-type-param: true
    ignore-chan-recv-ok: true

linters:
  disable-all: true
  enable:
    - varnamelen # check lenght of scope of a variable

    - asasalint # prevents from passing []any
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - cyclop
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - forbidigo
    - forcetypeassert
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godot
    - godox
    - err113
    - goheader
    - mnd
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - gosec
    - govet
    - grouper
    - importas
    - ineffassign
    - interfacebloat
    - ireturn
    - lll
    - loggercheck
    - maintidx
    - makezero
    - misspell
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - nlreturn
    - noctx
    - nolintlint
    - nosprintfhostport
    - paralleltest
    - prealloc
    - predeclared
    - promlinter
    - reassign
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - tagliatelle
    - testableexamples
    - testpackage
    - thelper
    - tparallel
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
    - whitespace
    - wrapcheck
    - wsl_v5

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports

issues:
  exclude-dirs:
    - configs
  exclude-rules:
    - path: docs\.swagger_ui\.go
      linters:
        - typecheck
    - linters:
        - staticcheck
      text: "SA9003:"
    - linters:
        - lll
      source: "^//go:generate "