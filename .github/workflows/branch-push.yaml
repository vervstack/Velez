name: branch-push
run-name: ${{ github.REF_NAME }} pull request
on:
  push:
    branches:
      - "*"
      - "!master"

jobs:
  create-pr:
    runs-on: ${{ vars.UBUNTU_IMAGE }}
    steps:
      - name: Create PR
        uses: RedSockActions/create_pr@v0.0.10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

  unit-test:
    runs-on: ${{ vars.UBUNTU_IMAGE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5

      - name: Test
        run: go test -tags github_wf $(go list ./... | grep -v /tests/e2e)

  e2e-test:
    runs-on: ${{ vars.UBUNTU_IMAGE }}
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5

      - name: Restore e2e images
        id: e2e-images
        uses: actions/cache@v4
        with:
          path: ~/.cache/e2e-images
          key: e2e-images-${{ hashFiles('tests/e2e/dind_ports.go', 'tests/dind/dind.go') }}

      - name: Load cached e2e images
        if: steps.e2e-images.outputs.cache-hit == 'true'
        run: docker load -i ~/.cache/e2e-images/images.tar

      - name: Snapshot runner images
        if: steps.e2e-images.outputs.cache-hit != 'true'
        run: docker image ls --format '{{.ID}}' | sort -u > "$RUNNER_TEMP/images-before"

      - name: Test
        run: make e2e
        env:
          VELEZ_E2E_MAX_GROUPS: "4"

      - name: Save e2e images
        if: steps.e2e-images.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/e2e-images
          docker image ls --format '{{.ID}} {{.Repository}}:{{.Tag}}' | grep -v -e '<none>' -e ' velez:e2e$' \
            | awk 'NR==FNR{seen[$1];next} !($1 in seen){print $2}' "$RUNNER_TEMP/images-before" - \
            | xargs docker save -o ~/.cache/e2e-images/images.tar

      - name: Group logs
        if: failure()
        run: |
          for f in /tmp/velez-e2e-logs-*/*.log; do
            echo "::group::$f"
            tail -n 400 "$f"
            echo "::endgroup::"
          done
